<style>
:root{--bg:#e9f0ea;--surface:#fff;--ink:#10261f;--muted:#4f6b5f;--line:#c5d6cb;--red:#c4372c;--green:#1f7a52;--chipS:#dfe8e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2620;--surface:#16352c;--ink:#eef1e8;--muted:#9db3a7;--line:#2a5244;--red:#e0483c;--green:#5fcf94;--chipS:#24493d}}
:root[data-theme="dark"]{--bg:#0f2620;--surface:#16352c;--ink:#eef1e8;--muted:#9db3a7;--line:#2a5244;--red:#e0483c;--green:#5fcf94;--chipS:#24493d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font:800 34px/1.1 "Arial Narrow","Roboto Condensed","Barlow Condensed",Impact,sans-serif;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
button,select,input{font:inherit;color:inherit}
.tab{border:0;background:none;padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px}
.big{font:800 clamp(96px,26vw,168px)/.9 "Arial Narrow","Roboto Condensed","Barlow Condensed",Impact,sans-serif;margin:0;color:var(--ink)}
.q{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stats{color:var(--muted);text-align:right;font-weight:600}
.stats b{color:var(--ink);font:800 28px "Arial Narrow","Roboto Condensed","Barlow Condensed",sans-serif}
.row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
input[type=text]{flex:1 1 200px;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:20px;text-transform:uppercase}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.alt{background:var(--chipS);color:var(--ink)}
.help{color:var(--muted);font-size:14px;margin:10px 0 0}
#fb{min-height:64px;margin-top:16px;font-size:18px}
#fb.ok{color:var(--green)}#fb.ko{color:var(--red)}
.route{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.chip{font:800 20px/1 "Arial Narrow","Roboto Condensed","Barlow Condensed",sans-serif;padding:7px 11px;border-radius:999px;background:var(--chipS);color:var(--ink);letter-spacing:.02em}
.chip.t{background:var(--red);color:#fff}
.chip.d{background:var(--green);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.it{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.it .n{font:800 36px/1 "Arial Narrow","Roboto Condensed","Barlow Condensed",sans-serif;min-width:58px}
.note{margin-top:16px;color:var(--muted)}
.tline{display:flex;align-items:center;gap:10px;margin-top:14px}
.tbar{flex:1;height:10px;border-radius:99px;background:var(--chipS);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--green)}
.tline.low .tbar i{background:var(--red)}
.tline.low b{color:var(--red)}
.tline b{font:800 26px "Arial Narrow","Roboto Condensed","Barlow Condensed",sans-serif;min-width:36px;text-align:right}
.slots{display:flex;gap:8px;margin-top:18px;min-height:44px}
.chip.e{background:none;border:2px dashed var(--line);color:var(--muted)}
#fb:empty{min-height:0;margin:0}
.mult{display:flex;gap:6px;margin-top:14px}
.mult .k{flex:1;font-size:20px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.k{border:0;border-radius:10px;padding:12px 0;font:800 24px "Arial Narrow","Roboto Condensed","Barlow Condensed",sans-serif;background:var(--chipS);color:var(--ink);cursor:pointer}
.k.on{background:var(--ink);color:var(--bg)}
html,body{height:100%}
main{height:100%;max-width:820px;padding:10px 12px;display:flex;flex-direction:column;overflow:auto}
.bar{flex:none;margin-bottom:8px}
.bar h1{margin:0;flex:1;font-size:26px}
.tab{padding:7px 14px}
select{padding:7px 10px}
#quiz{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px}
#ref{flex:1;min-height:0;overflow:auto}
.big{font-size:clamp(60px,17vh,130px)}
.q{flex:none}
.tline,.slots,.mult,.row{margin-top:8px}
.slots{flex:none;min-height:38px}
.chip{font-size:18px;padding:5px 10px}
#fb{flex:none;margin-top:8px;font-size:17px}
#fb:not(:empty){flex:1;font-size:20px}
#keys{flex:1;min-height:0;display:flex;flex-direction:column}
.pad{flex:1;min-height:0;grid-template-columns:repeat(11,1fr);grid-auto-rows:1fr}
.pad .k{padding:0;font-size:clamp(18px,4vh,26px)}
.mult .k{padding:8px 0}
.btn{padding:10px 16px}
#nxrow .btn{flex:1;padding:16px}
@media (max-width:560px){.bar h1{display:none}.tabs{flex:1 1 100%}.tab{flex:1}select{flex:1 1 0;min-width:0;font-size:16px}.pad{grid-template-columns:repeat(6,1fr)}}
@media (max-height:560px){.big{font-size:14vh}.mult .k{padding:5px 0}.slots{min-height:34px}.pad .k{font-size:18px}}
@media (max-height:520px){.bar h1{display:none}}
button,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.k,.btn,.tab{user-select:none;-webkit-user-select:none}
body{overscroll-behavior:none;-webkit-text-size-adjust:100%}

.mult .k[data-m="3"],.pad[data-m="3"] .k{--c:var(--red);--t:#fff}
.pad .k[data-n="25"]{--c:var(--amber);--t:#1b1b1b}
.pad .k[data-n="50"]{--c:var(--violet);--t:#fff}
.chip.o{background:var(--amber);color:#1b1b1b}
.chip.b{background:var(--violet);color:#fff}
.pad .k{background:var(--c);color:var(--t)}
.mult .k{background:transparent;border:2px solid var(--c);color:var(--c)}
.mult .k.on{background:var(--c);color:var(--t)}
</style>
</head>
<body>
<main>
<div class="bar">
<h1>Finishes 501</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t1" aria-selected="true">S’entraîner</button>
    <button class="tab" role="tab" id="t2" aria-selected="false">Réviser</button>
  </div>
  <select id="rng" aria-label="Plage de scores">
    <option value="2-40">2 à 40 (un double)</option>
    <option value="41-100">41 à 100</option>
    <option value="101-170">101 à 170 (trois fléchettes)</option>
    <option value="2-170" selected>Tous les scores</option>
  </select>
  <select id="tm" aria-label="Minuteur">
    <option value="0">Sans minuteur</option>
    <option value="30">Minuteur 30 s</option>
    <option value="15">Minuteur 15 s</option>
  </select>
</div>

<section id="quiz" class="card">
  <div class="q">
    <p class="big" id="sc">–</p>
    <div class="stats"><b id="st">0</b> / <span id="tot">0</span><br>maîtrisés</div>
  </div>
  <div class="tline" id="tline" hidden><div class="tbar"><i id="tfill"></i></div><b id="tsec"></b></div>
  <div class="slots" id="slots"></div>
  <div id="fb" aria-live="polite"></div>
  <div id="keys">
    <div class="mult" id="mult"><button class="k" data-m="1">Simple</button><button class="k" data-m="2">Double</button><button class="k" data-m="3">Triple</button></div>
    <div class="pad" id="pad"></div>
    <div class="row"><button class="btn" id="ok">Valider</button><button class="btn alt" id="del">Effacer</button><button class="btn alt" id="giveup">Je ne sais pas</button></div>
  </div>
  <div class="row" id="nxrow" hidden><button class="btn" id="nx">Score suivant</button></div>
</section>

<section id="ref" hidden>
  <div class="grid" id="grid"></div>
  <p class="note">Scores sans sortie en trois fléchettes (bogey) : 169, 168, 166, 165, 163, 162, 159.</p>
</section>
</main>

<script>

const F=RAW.split("\n").map(l=>{const a=l.split(" ");return{s:+a[0],r:a.slice(1)}});
const $=id=>document.getElementById(id);
let box={},cur=null;
try{box=JSON.parse(localStorage.getItem("f501box")||"{}")}catch(e){}
function save(){try{localStorage.setItem("f501box",JSON.stringify(box))}catch(e){}}

function chip(t){
  const u=t.toUpperCase();
  const c=u==="BULL"?"b":u==="25"?"o":u[0]==="T"?"t":u[0]==="D"?"d":"";
  return '<span class="chip '+c+'">'+t+'</span>';
}
function routeHTML(r){return '<span class="route">'+r.map(chip).join("")+'</span>'}
function range(){const [a,b]=$("rng").value.split("-").map(Number);return F.filter(f=>f.s>=a&&f.s<=b)}

function next(){
  const pool=range(),w=pool.map(f=>[6,3,1.5,.25][box[f.s]||0]);
  let x=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
  while(x>w[i]&&i<pool.length-1){x-=w[i];i++}
  cur=pool[i];
  $("sc").textContent=cur.s;$("fb").innerHTML="";$("fb").className="";
  darts=[];mult=1;over=false;$("keys").hidden=false;$("nxrow").hidden=true;draw();stats();startT();
}
function stats(){const p=range();$("st").textContent=p.filter(f=>(box[f.s]||0)>=3).length;$("tot").textContent=p.length}
let darts=[],mult=1,over=false,tmr=null;
function stopT(){clearInterval(tmr)}
function startT(){
  stopT();const lim=+$("tm").value;$("tline").hidden=!lim;
  if(!lim)return;
  const t0=Date.now();
  const tick=()=>{
    const left=Math.max(0,lim-(Date.now()-t0)/1000);
    $("tfill").style.width=left/lim*100+"%";
    $("tsec").textContent=Math.ceil(left);
    $("tline").classList.toggle("low",left<=5);
    if(!left)submit("time");
  };
  tick();tmr=setInterval(tick,100);
}
const isD=d=>d.m===2||d.n===50;
const sum=()=>darts.reduce((a,d)=>a+d.n*d.m,0);
const dartTxt=d=>d.n===50?"Bull":d.n===25?"25":(d.m===3?"T":d.m===2?"D":"")+d.n;
function draw(){
  $("slots").innerHTML=[0,1,2].map(i=>darts[i]?chip(dartTxt(darts[i])):'<span class="chip e">–</span>').join("");
  [...$("mult").children].forEach(b=>b.classList.toggle("on",+b.dataset.m===mult));
  $("pad").dataset.m=mult;
}
function add(n){
  if(over||darts.length>=3)return;
  darts.push({n:n,m:n>20?1:mult});draw();
  const s=sum();
  if(darts.length===3||s>cur.s||(s===cur.s&&isD(darts[darts.length-1])))submit();
}
function submit(g){
  if(over||(!darts.length&&!g))return;
  over=true;stopT();
  const s=sum(),ok=!g&&s===cur.s&&isD(darts[darts.length-1]);
  const same=ok&&darts.map(dartTxt).join()===cur.r.join();
  box[cur.s]=ok?Math.min(3,(box[cur.s]||0)+1):0;save();stats();
  $("fb").className=ok?"ok":"ko";
  $("fb").innerHTML=same?"Bonne sortie !":ok?"Valide, mais la sortie classique est "+routeHTML(cur.r)+".":(g?(g==="time"?"Temps écoulé. ":""):(s!==cur.s?"Le total fait "+s+". ":"Il faut finir sur un double. "))+"La sortie classique : "+routeHTML(cur.r);
  $("keys").hidden=true;$("nxrow").hidden=false;$("nx").focus();
}
function table(){
  $("grid").innerHTML=range().map(f=>'<div class="it"><span class="n">'+f.s+'</span>'+routeHTML(f.r)+'</div>').join("");
}
function tab(n){
  $("t1").setAttribute("aria-selected",n===1);$("t2").setAttribute("aria-selected",n===2);
  $("quiz").hidden=n!==1;$("ref").hidden=n!==2;
  if(n===2){table();stopT()}else next();
}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
$("rng").onchange=()=>{table();next()};
$("pad").innerHTML=[...Array(20)].map((_,i)=>'<button class="k" data-n="'+(i+1)+'">'+(i+1)+'</button>').join("")+'<button class="k" data-n="25">25</button><button class="k" data-n="50">Bull</button>';
$("mult").onclick=e=>{const m=+e.target.dataset.m;if(m){mult=m;draw()}};
$("pad").onclick=e=>{const n=+e.target.dataset.n;if(n)add(n)};
$("del").onclick=()=>{if(!over){darts.pop();draw()}};
$("ok").onclick=()=>submit();$("giveup").onclick=()=>submit(true);$("nx").onclick=next;$("tm").onchange=next;
next();
</script>
